# LSPAY on Render.
#
# Option A (recommended): deploy as a STATIC SITE.
#   New > Static Site > pick this repo > Publish Directory: .  (no build command)
#
# Option B: deploy as a WEB SERVICE (Node) using this blueprint / the settings below.
#   Language: Node  |  Build Command: npm install  |  Start Command: npm start
services:
  - type: web
    name: lspay
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
