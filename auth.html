<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LSPAY — Open an account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="auth-page">
  <div class="auth-wrap">
    <div class="auth-brand">
      <a href="index.html" class="brand brand-lg">
        <span class="brand-mark">LS</span><span class="brand-name">PAY</span>
      </a>
      <h2 id="authTagline">Open your free account</h2>
      <p class="muted">Your premium wallet — pay anyone, add money, done.</p>
      <ul class="check-list">
        <li>Instant transfers to any LSPAY user</li>
        <li>Add cards & bank accounts</li>
        <li>Track every transaction</li>
      </ul>
    </div>

    <div class="auth-card">
      <div class="tabs">
        <button class="tab active" data-tab="signup" id="tabSignup">Sign up</button>
        <button class="tab" data-tab="login" id="tabLogin">Log in</button>
      </div>

      <!-- SIGN UP -->
      <form id="signupForm" class="auth-form">
        <label>Full name
          <input type="text" name="name" placeholder="Jane Doe" required />
        </label>
        <label>Username
          <input type="text" name="username" placeholder="janedoe" autocomplete="off" required />
        </label>
        <label>Email
          <input type="email" name="email" placeholder="jane@email.com" required />
        </label>
        <label>Password
          <input type="password" name="password" placeholder="Create a password" minlength="4" required />
        </label>
        <div class="form-error" id="signupError"></div>
        <button type="submit" class="btn btn-primary btn-block">Open an account</button>
      </form>

      <!-- LOGIN -->
      <form id="loginForm" class="auth-form hidden">
        <label>Username
          <input type="text" name="username" placeholder="janedoe" autocomplete="off" required />
        </label>
        <label>Password
          <input type="password" name="password" placeholder="Your password" required />
        </label>
        <div class="form-error" id="loginError"></div>
        <button type="submit" class="btn btn-primary btn-block">Log in</button>
      </form>

      <p class="fine">By continuing you agree to the LSPAY demo terms.</p>
    </div>
  </div>

  <script src="js/store.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
